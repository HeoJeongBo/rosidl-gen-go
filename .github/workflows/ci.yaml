name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Exactly the go directive (1.26.3) so gofmt bytes are stable for -check.
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go run . -config example/rosidl-gen.yaml -check
      - run: go run ./example/emitter -config example/emitter/rosidl-gen.yaml -check
